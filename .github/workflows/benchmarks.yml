name: Nightly Performance Benchmarks

on:
  schedule:
    # Run nightly at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'contracts/analytics/**'
      - 'scripts/check_benchmarks.*'
      - '.github/workflows/*bench*.yml'

permissions:
  contents: read

jobs:
  benchmark-analytics:
    name: Analytics Benchmark & Regression Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Analytics Benchmarks with Regression Checks
        run: |
          chmod +x scripts/check_benchmarks.sh
          python3 scripts/check_benchmarks.py --contract analytics --thresholds contracts/analytics/benches/thresholds.json

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-benchmark-report
          path: |
            benchmark_report.md
            benchmark_results.json
            target/criterion
          if-no-files-found: ignore
